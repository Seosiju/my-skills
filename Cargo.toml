[package]
name = "my-skills"
version = "1.5.0"
description = "Personal skill drive: one canonical skill registry, linked into every agent host."
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Seosiju/my-skills"

[lib]
name = "my_skills"
path = "src/lib.rs"

[[bin]]
name = "my-skills"
path = "src/main.rs"

[dependencies]
# core (skeleton)
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# YAML 1.2 for SKILL.md frontmatter. PyYAML 1.1 scalars (yes/no/on/off)
# parse as strings.
yaml-rust2 = "0.13"
sha2 = "0.10"
similar = "2"
walkdir = "2"
toml = "0.8"
dirs = "6"
pulldown-cmark = { version = "0.13", default-features = false }
cap-fs-ext = "4"
cap-std = "4"
include_dir = "0.7"
tempfile = "3"
flate2 = "1"
fs4 = "1.1"
semver = "1"
url = "2"

[target.'cfg(windows)'.dependencies]
junction = "1"
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default"] }
zip = { version = "7.2", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(not(windows))'.dependencies]
tar = { version = "0.4.46", default-features = false }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
