name: Release Rust

on:
  push:
    tags: ['v1.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            extension: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            extension: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            extension: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: zip
    env:
      TARGET: ${{ matrix.target }}
      ARCHIVE: my-skills-${{ matrix.target }}.${{ matrix.extension }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up stable Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo +stable build --locked --release --target ${{ matrix.target }} --bin my-skills

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir package
          cp "target/$TARGET/release/my-skills" LICENSE README.md package/
          COPYFILE_DISABLE=1 tar -czf "$ARCHIVE" -C package my-skills LICENSE README.md

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @("target/$env:TARGET/release/my-skills.exe", "LICENSE", "README.md")
          Compress-Archive -LiteralPath $files -DestinationPath $env:ARCHIVE

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: rust-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: rust-*
          merge-multiple: true
          path: release

      - name: Generate SHA256SUMS
        working-directory: release
        run: |
          sha256sum my-skills-aarch64-apple-darwin.tar.gz \
            my-skills-x86_64-apple-darwin.tar.gz \
            my-skills-x86_64-unknown-linux-gnu.tar.gz \
            my-skills-x86_64-pc-windows-msvc.zip > SHA256SUMS

      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: rust-release
          path: release/*
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v1.')
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v8
        with:
          name: rust-release
          path: release

      - name: Publish GitHub Release
        shell: bash
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check SHA256SUMS
          release_flags=()
          case "$RELEASE_TAG" in
            *-alpha.*|*-beta.*|*-rc.*) release_flags+=(--prerelease) ;;
          esac
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes "${release_flags[@]}" ./*
