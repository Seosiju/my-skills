name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-smoke:
    name: Test, build, and smoke
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Run tests
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Run CLI smoke checks
        run: |
          uv run my-skills doctor
          uv run my-skills skills --json
          uv run my-skills bootstrap --dry-run
          uv run my-skills install my-skills --host hermes --dry-run
          uv run my-skills install my-skills --host agy --dry-run

      - name: Run uv tool install smoke checks
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/tools" "$tmp/bin" "$tmp/home" "$tmp/state" "$tmp/data" "$tmp/config"
          UV_TOOL_DIR="$tmp/tools" UV_TOOL_BIN_DIR="$tmp/bin" \
            uv tool install --force "git+file://$GITHUB_WORKSPACE@$GITHUB_SHA"
          PATH="$tmp/bin:$PATH" \
          HOME="$tmp/home" \
          XDG_STATE_HOME="$tmp/state" \
          XDG_DATA_HOME="$tmp/data" \
          XDG_CONFIG_HOME="$tmp/config" \
            my-skills bootstrap --dry-run
          PATH="$tmp/bin:$PATH" \
          HOME="$tmp/home" \
          XDG_STATE_HOME="$tmp/state" \
          XDG_DATA_HOME="$tmp/data" \
          XDG_CONFIG_HOME="$tmp/config" \
            my-skills doctor
          PATH="$tmp/bin:$PATH" \
          HOME="$tmp/home" \
          XDG_STATE_HOME="$tmp/state" \
          XDG_DATA_HOME="$tmp/data" \
          XDG_CONFIG_HOME="$tmp/config" \
            my-skills skills --json
          PATH="$tmp/bin:$PATH" \
          HOME="$tmp/home" \
          XDG_STATE_HOME="$tmp/state" \
          XDG_DATA_HOME="$tmp/data" \
          XDG_CONFIG_HOME="$tmp/config" \
            my-skills install my-skills --host hermes --dry-run
          PATH="$tmp/bin:$PATH" \
          HOME="$tmp/home" \
          XDG_STATE_HOME="$tmp/state" \
          XDG_DATA_HOME="$tmp/data" \
          XDG_CONFIG_HOME="$tmp/config" \
            my-skills install my-skills --host agy --dry-run

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Record Windows user directories before Rust tests
        id: windows-paths-before
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $snapshot = Join-Path $env:RUNNER_TEMP 'my-skills-user-paths.ps1'
          @'
          $locations = @(
            "$env:USERPROFILE\.claude\skills"
            "$env:USERPROFILE\.agents\skills"
            "$env:USERPROFILE\.gemini\config\skills"
            "$env:USERPROFILE\.hermes"
            "$env:LOCALAPPDATA\my-skills"
          )
          foreach ($location in $locations) {
            if (Test-Path -LiteralPath $location) {
              $(Get-Item -LiteralPath $location -Force
                Get-ChildItem -LiteralPath $location -Force -Recurse) |
                ForEach-Object { "$($_.Mode) $($_.FullName)" }
            } else {
              "Missing $location"
            }
          }
          '@ | Set-Content -LiteralPath $snapshot
          & $snapshot | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'my-skills-user-paths.txt')

      - name: Run Rust tests
        run: cargo test --all-targets

      - name: Check Windows user directories after Rust tests
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.windows-paths-before.outcome == 'success' }}
        shell: pwsh
        run: |
          $snapshot = Join-Path $env:RUNNER_TEMP 'my-skills-user-paths.ps1'
          $before = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'my-skills-user-paths.txt')
          $changes = Compare-Object -CaseSensitive -ReferenceObject $before -DifferenceObject @(& $snapshot)
          if ($changes) {
            $changes | Format-List
            throw 'Rust tests changed Windows user directory listings.'
          }
