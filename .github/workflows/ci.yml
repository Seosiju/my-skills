name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Record Windows user directories before Rust tests
        id: windows-paths-before
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $snapshot = Join-Path $env:RUNNER_TEMP 'my-skills-user-paths.ps1'
          @'
          # Host folders and my-skills root/state/data locations, under USERPROFILE and,
          # when it differs, HOME (the CLI reads HOME first). XDG overrides count too.
          $homes = @($env:USERPROFILE)
          if ($env:HOME -and $env:HOME -ne $env:USERPROFILE) { $homes += $env:HOME }
          $locations = @()
          foreach ($userHome in $homes) {
            $locations += @(
              "$userHome\.claude\skills"
              "$userHome\.agents\skills"
              "$userHome\.gemini\config\skills"
              "$userHome\.config\my-skills"
              "$userHome\.local\state\my-skills"
              "$userHome\.local\share\my-skills"
            )
          }
          $locations += "$env:LOCALAPPDATA\my-skills"
          foreach ($name in 'XDG_CONFIG_HOME', 'XDG_STATE_HOME', 'XDG_DATA_HOME') {
            $base = [Environment]::GetEnvironmentVariable($name)
            if ($base) { $locations += (Join-Path $base 'my-skills') }
          }
          foreach ($location in $locations) {
            if (Test-Path -LiteralPath $location) {
              $(Get-Item -LiteralPath $location -Force
                Get-ChildItem -LiteralPath $location -Force -Recurse) |
                ForEach-Object { "$($_.Mode) $($_.FullName)" }
            } else {
              "Missing $location"
            }
          }
          '@ | Set-Content -LiteralPath $snapshot
          & $snapshot | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'my-skills-user-paths.txt')

      - name: Run Rust tests
        run: cargo test --all-targets

      - name: Check Windows user directories after Rust tests
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.windows-paths-before.outcome == 'success' }}
        shell: pwsh
        run: |
          $snapshot = Join-Path $env:RUNNER_TEMP 'my-skills-user-paths.ps1'
          $before = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'my-skills-user-paths.txt')
          $changes = Compare-Object -CaseSensitive -ReferenceObject $before -DifferenceObject @(& $snapshot)
          if ($changes) {
            $changes | Format-List
            throw 'Rust tests changed Windows user directory listings.'
          }
